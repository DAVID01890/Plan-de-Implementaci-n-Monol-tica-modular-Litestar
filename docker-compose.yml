services:
  api:
    build: .
    container_name: poc-api
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      - PORT=8002
    volumes:
      - ./local.db:/app/local.db
    restart: unless-stopped

  mcp:
    build: .
    container_name: poc-mcp
    ports:
      - "8101:8101"
    env_file: .env
    command: python -m src.mcp_server sse
    depends_on:
      - api
    restart: unless-stopped
