services:
  api:
    build: .
    container_name: poc-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PORT=8000
    volumes:
      - ./local.db:/app/local.db
    restart: unless-stopped

  mcp:
    build: .
    container_name: poc-mcp
    ports:
      - "8100:8100"
    env_file: .env
    command: python -m src.mcp_server sse
    depends_on:
      - api
    restart: unless-stopped
